name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Public payload scan
        run: ./scripts/public-scan.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/apply-owned-patches.py src/run-session.py src/bridge.py src/kernel_modifiers.py src/xguard.py
      - name: Shell syntax
        run: bash -n scripts/build-input-filter.sh scripts/install-desktop-entry.sh scripts/public-scan.sh
      - name: Build input filter
        run: ./scripts/build-input-filter.sh
